plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sbtltv'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "com.sbtltv.sbtlnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // React Native ships OkHttp; the module compiles against the same version and does not bundle its own.
  compileOnly "com.squareup.okhttp3:okhttp:4.9.2"
  testImplementation "com.squareup.okhttp3:okhttp:4.9.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.9.2"
  testImplementation "junit:junit:4.13.2"
}
