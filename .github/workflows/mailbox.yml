name: Mailbox
on:
  push:
    branches: [dev, main]
    paths: ['packages/mailbox/**', '.github/workflows/mailbox.yml']
  pull_request:
    paths: ['packages/mailbox/**', '.github/workflows/mailbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The sync group store runs its contract against a real Postgres too
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: t }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      MAILBOX_TEST_PG: postgres://postgres:t@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sbtltv/mailbox typecheck
      - run: pnpm --filter @sbtltv/mailbox test
  # The live relay changes with releases: :main is built from main only. Started by hand on another
  # branch, the image gets only its commit SHA, for trying a branch on the cluster first
  image:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sbtltv/mailbox build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/mailbox
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/thesubtleties/sbtltv-mailbox:main' || '' }}
            ghcr.io/thesubtleties/sbtltv-mailbox:${{ github.sha }}
