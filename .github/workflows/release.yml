name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Fails before anything is built or published (see the Beta Ceremony in the
  # release runbook): betas vX.Y.Z-beta.N come from dev, stables vX.Y.Z from
  # main, and the tag must match the version in both package.json files.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, branch and version agree
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            branch=dev
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            branch=main
          else
            echo "::error::$tag is neither vX.Y.Z nor vX.Y.Z-beta.N"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$tag ($GITHUB_SHA) is not on $branch; $([[ $branch == dev ]] && echo betas || echo stable releases) are tagged from $branch"
            exit 1
          fi
          for file in package.json packages/electron/package.json; do
            version=$(node -p "require('./$file').version")
            if [[ "v$version" != "$tag" ]]; then
              echo "::error::$file is $version but the tag is $tag"
              exit 1
            fi
          done
          echo "$tag: on $branch, versions match"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          # Oldest supported LTS on purpose: the native addon inherits this
          # runner's glibc floor. ubuntu-latest (24.04) produced a .node that
          # would not load on Ubuntu 22.04-era distros (GLIBC_2.36/2.38).
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install native build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libegl1-mesa-dev libgbm-dev libdrm-dev libgl-dev pkg-config patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Electron
        run: pnpm --filter @sbtltv/electron exec install-electron

      # Windows: Bundle external mpv binary (--wid mode, no native addon)
      - name: Install mpv (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          choco install mpvio -y
          mkdir -p packages/electron/mpv-bundle
          cp "C:/ProgramData/chocolatey/lib/mpvio.install/tools/"*.exe packages/electron/mpv-bundle/
          cp "C:/ProgramData/chocolatey/lib/mpvio.install/tools/"*.dll packages/electron/mpv-bundle/

      # macOS: Install mpv SDK, build native addon, bundle dylibs
      - name: Setup mpv (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install mpv
          cd packages/mpv-texture
          chmod +x scripts/setup-mpv-mac.sh
          ./scripts/setup-mpv-mac.sh

      - name: Build all packages
        run: pnpm build

      - name: Record build identity
        shell: bash
        run: |
          printf '{"sha":"%s","run":"%s","ref":"%s"}\n' "${GITHUB_SHA:0:7}" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" > packages/electron/dist/build-info.json
          cat packages/electron/dist/build-info.json

      - name: Build native addon
        if: matrix.platform == 'mac' || matrix.platform == 'linux'
        run: |
          cd packages/mpv-texture
          npm run build:native

      - name: Bundle native dylibs (macOS)
        if: matrix.platform == 'mac'
        run: |
          chmod +x packages/mpv-texture/scripts/bundle-dylibs-mac.sh
          packages/mpv-texture/scripts/bundle-dylibs-mac.sh

      - name: Build Electron app
        run: pnpm dist:${{ matrix.platform }} --publish never
        env:
          # macOS code signing
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTS_PASSWORD || '' }}
          # macOS notarization
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      # electron-builder puts mac.minimumSystemVersion into Info.plist only; the
      # update feed never gets it, so an older client would install a build its
      # OS cannot launch. electron-updater compares the feed field against
      # os.release(), the Darwin kernel version, so write it in Darwin terms:
      # macOS 13 (Ventura) = Darwin 22. Bump this together with
      # mac.minimumSystemVersion in electron-builder.yml.
      - name: Pin macOS update feed minimum (Darwin 22 = macOS 13)
        if: matrix.platform == 'mac'
        # The feed is latest-mac.yml, or beta-mac.yml for a beta version.
        run: |
          for feed in release/*-mac.yml; do
            if [ ! -e "$feed" ]; then
              echo "::error::No macOS update feed (release/*-mac.yml) to pin"
              exit 1
            fi
            if grep -q '^minimumSystemVersion:' "$feed"; then
              sed -i '' 's/^minimumSystemVersion:.*/minimumSystemVersion: 22.0.0/' "$feed"
            else
              printf 'minimumSystemVersion: 22.0.0\n' >> "$feed"
            fi
            grep -n '^minimumSystemVersion:' "$feed"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.yaml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
